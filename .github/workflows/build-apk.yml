name: Gerar APK do APlayer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixando o código
        uses: actions/checkout@v4

      - name: 📦 Configurando pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: 🟢 Configurando Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: ☕ Configurando Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 Instalando dependências
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Gerando projeto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: 🔨 Construindo APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Salvando o APK
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-APK-v1.1.0
          path: android/app/build/outputs/apk/release/*.apk
